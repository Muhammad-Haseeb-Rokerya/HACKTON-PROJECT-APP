
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script>
        try {
            document.documentElement.dataset.mode =
                localStorage.hcm_mode || '';
        } catch (e) {}
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HCM Lite - Task submissions</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Fredoka:wght@500;600;700&display=swap"
    >

    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="global.css">
</head>

<body>
    <div id="nav"></div>

    <main>
        <div class="card">
            <h3>Task submissions from employees</h3>

            <div class="t">
                <table>
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Task</th>
                            <th>Text</th>
                            <th>File</th>
                            <th>Submitted</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody id="rows"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="storage.js"></script>
    <script src="theme.js"></script>
    <script src="app.js"></script>
    <script src="auth.js"></script>
    <script src="tasks.js"></script>

    <script>
        nav(guard('admin'));
        adminTasks();
    </script>
</body>
</html>
