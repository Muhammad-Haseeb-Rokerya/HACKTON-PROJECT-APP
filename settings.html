
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script>
        try {
            document.documentElement.dataset.mode =
                localStorage.hcm_mode || '';
        } catch (e) {}
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HCM Lite - Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Fredoka:wght@500;600;700&display=swap"
    >

    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="global.css">
</head>

<body>
    <div id="nav"></div>

    <main>
        <div class="card">
            <h3>Company settings</h3>

            <p>
                Company<br>
                <input id="cn">
            </p>

            <p>
                Office start time<br>
                <input id="st" type="time">
            </p>

            <p>
                Grace minutes (after this = late)<br>
                <input id="gr" type="number">
            </p>

            <p>
                Half day after (minutes past start)<br>
                <input id="hf" type="number">
            </p>

            <p>
                Leave quota (days/year)<br>
                <input id="qt" type="number">
            </p>

            <p>
                Theme colour<br>
                <select id="tc"></select>
            </p>

            <p>
                Heading font<br>
                <select id="tf"></select>
            </p>

            <button onclick="save()">Save</button>
        </div>
    </main>

    <script src="storage.js"></script>
    <script src="theme.js"></script>
    <script src="app.js"></script>
    <script src="auth.js"></script>

    <script>
        nav(guard('admin'));

        const d = DB.get();
        const c = d.company;

        cn.value = c.name;
        st.value = c.start;
        gr.value = c.grace;
        hf.value = c.half;
        qt.value = c.quota;

        tc.innerHTML = Object.keys(PALETTES)
            .map(k => `<option>${k}</option>`)
            .join('');

        tf.innerHTML = FONTS
            .map(k => `<option>${k}</option>`)
            .join('');

        tc.value = (c.theme || {}).c;

        if (!tc.value) {
            tc.value = Object.keys(PALETTES)[0];
        }

        tf.value = (c.theme || {}).f;

        if (!tf.value) {
            tf.value = FONTS[0];
        }

        tc.onchange = tf.onchange = () => {
            applyTheme({
                c: tc.value,
                f: tf.value
            });
        };

        function save() {
            Object.assign(c, {
                name: cn.value,
                start: st.value,
                grace: +gr.value,
                half: +hf.value,
                quota: +qt.value,
                theme: {
                    c: tc.value,
                    f: tf.value
                }
            });

            applyTheme(c.theme);
            DB.set(d);
            confetti(60);

            alert('✅ Saved – looking good!');
        }
    </script>
</body>
</html>
